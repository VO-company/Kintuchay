<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Kintuchay Restobar</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="code.css" />
    <style>
      body.light-mode {
        background-color: rgb(206, 206, 206);
        background-image: url("assets/background/lb.webp");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
      }
      body.dark-mode {
        background-color: rgb(41, 41, 41);
        background-image: url("assets/background/db.webp");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
      }
    </style>
  </head>
  <body data-smooth-scroll data-smooth="0.08">
    <div class="top-bar">
      <div class="menu-box">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="bar-logo">
        <img class="logo-pc" src="assets/title_bar.svg" alt="Logo PC" />
        <img class="logo-mobile" src="assets/icon_bar.svg" alt="Logo Móvil" />
      </div>
      <div class="lang-toggle" id="lang-toggle">ES</div>
    </div>
    <div class="banner">
      <img src="assets/banners/main.webp" alt="Banner Principal" />
      <div class="banner-content">
        <div class="icon-container">
          <img src="assets/icon.svg" alt="Icono" />
        </div>
        <div class="text-container" data-lang="ui.welcome"></div>
      </div>
    </div>
    <div class="sections-container"></div>
<div class="menus-container">
  <button class="menu-btn food">
    <div class="btn-title" data-lang="menu"></div>
    <img src="assets/title_bar.svg" alt="menu food">
    <div class="btn-subtitle" data-lang="menu.food"></div>
  </button>
  <button class="menu-btn drinks">
    <div class="btn-title" data-lang="menu"></div>
    <img src="assets/title_bar.svg" alt="menu drinks">
    <div class="btn-subtitle" data-lang="menu.drinks"></div>
  </button>
</div>
    <div class="map-container">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d242.45990794261797!2d-71.97418624702314!3d-13.513575635517789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x916dd7f8635659b7%3A0x79aada17082e0e29!2sK'intuchay!5e0!3m2!1ses-419!2spe!4v1785962125775!5m2!1ses-419!2spe"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      >
      </iframe>
      <div class="map-actions">
        <a
          href="#"
          class="map-button"
          data-lang="map.google"
          onclick="
            event.preventDefault();
            playLeafAnimation('https://www.google.com/maps/dir/?api=1&destination=Kintuchay,+Kiskapata,+Cusco');
          "
        >
        </a>
        <a
          href="#"
          class="map-button"
          data-lang="map.waze"
          onclick="
            event.preventDefault();
            playLeafAnimation('https://waze.com/ul?q=Kintuchay%20Kiskapata%20Cusco&navigate=yes');
          "
        >
        </a>
      </div>
    </div>
    <div class="custom-scrollbar">
      <div class="thumb"></div>
    </div>
    <div id="leaf-overlay">
      <div class="contenedor">
        <img src="assets/leaf_load/sprite1.svg" id="leaf1" class="leaf" alt="Leaf1" />
        <img src="assets/leaf_load/sprite2.svg" id="leaf2" class="leaf" alt="Leaf2" />
        <img src="assets/leaf_load/sprite3.svg" id="leaf3" class="leaf" alt="Leaf3" />
      </div>
    </div>
    <footer>
      <div class="footer-top">
        <div class="footer-logo">
          <img class="logo-pc" src="assets/footer/icon.svg" alt="Icono Footer" />
          <img class="logo-mobile" src="assets/footer/title.svg" alt="Título Footer" />
        </div>
        <div class="footer-contacts">
          <h2 data-lang="footer.contacts"></h2>
          <div class="number_tell">
            <h3 data-lang="footer.tell"></h3>
            <a
              href="#"
              onclick="
                event.preventDefault();
                playLeafAnimation('tel:+51916669799');
              "
              >(+51) 916 669 799</a
            >
            <a
              href="#"
              onclick="
                event.preventDefault();
                playLeafAnimation('tel:+51993489932');
              "
              >(+51) 993 489 932</a
            >
          </div>
          <div class="social-buttons">
            <a
              href="#"
              class="facebook"
              onclick="
                event.preventDefault();
                playLeafAnimation('https://www.facebook.com/kintuchay.restobar.5?locale');
              "
            >
              <img src="assets/footer/networks/facebook.svg" alt="Facebook" />
            </a>
            <a
              href="#"
              class="instagram"
              onclick="
                event.preventDefault();
                playLeafAnimation('https://www.instagram.com/kintuchay_restobar/');
              "
            >
              <img src="assets/footer/networks/instagram.svg" alt="Instagram" />
            </a>
            <a
              href="#"
              class="tripadvisor"
              onclick="
                event.preventDefault();
                playLeafAnimation(
                  'https://www.tripadvisor.com.pe/Restaurant_Review-g294314-d23463209-Reviews-Kintuchay-Cusco_Cusco_Region.html',
                );
              "
            >
              <img src="assets/footer/networks/tripadvisor.svg" alt="Tripadvisor" />
            </a>
          </div>
        </div>
        <div class="footer-more">
          <a
            href="#"
            target="_blank"
            data-lang="footer.direction"
            onclick="
              event.preventDefault();
              playLeafAnimation('https://maps.app.goo.gl/6MCPi6C8sXKxGMWF9');
            "
          ></a>
        </div>
      </div>
      <div class="footer-credits">
        <p class="footer-rights" data-lang="footer.rights"></p>
        <p class="wave-text" data-lang="footer.slogan"></p>
      </div>
    </footer>
    <script src="libraries/smooth-scroll.js"></script>
    <script src="meta-data.js"></script>
    <script src="code.js"></script>
  </body>
</html>
