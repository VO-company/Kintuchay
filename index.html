<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Kintuchay Restobar</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="code.css">
  <link rel="preload" as="image" href="assets/background/lb.png">
</head>
<body 
  style="margin:0;
         font-family:'Roboto', Arial, sans-serif;
         background-image:url('assets/background/lb.png');
         background-size:100% 100%;
         background-repeat:no-repeat;
         background-position:center;
         overflow:hidden;"
  data-smooth-scroll data-smooth="0.08">
  <div class="top-bar"></div>
  <div class="banner">
    <img src="assets/banners/main.webp" alt="Banner Principal">
    <div class="banner-content">
      <div class="icon-container">
        <img src="assets/icon.svg" alt="Icono">
      </div>
      <div class="text-container" data-lang="ui.welcome"></div>
    </div>
  </div>
  <div class="sections-container"></div>
  <div class="custom-scrollbar">
    <div class="thumb"></div>
  </div>
  <script src="libraries/smooth-scroll.js"></script>
  <script src="meta-data.js"></script>
  <script src="code.js"></script>
</body>
</html>
